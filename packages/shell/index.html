<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>OpenCadEditor</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1c1c1c; color: #e8e8e8; font: 14px sans-serif; }
      body { display: grid; grid-template-rows: 1fr 160px; }
      canvas { width: 100%; height: 100%; display: block; }
      form { display: grid; grid-template-rows: 1fr auto; border-top: 1px solid #333; }
      textarea { background: #111; color: #d0d0d0; border: 0; resize: none; padding: 8px; }
      input { background: #111; color: #fff; border: 0; border-top: 1px solid #333; padding: 8px; }
    </style>
  </head>
  <body>
    <canvas id="vue"></canvas>
    <form id="terminal">
      <textarea id="journal" readonly></textarea>
      <input id="ligne" autocomplete="off" placeholder="commande" />
    </form>
    <script type="module" src="/src/page.ts"></script>
  </body>
</html>
