<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>OpenCadEditor</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1c1c1c; color: #e8e8e8; font: 14px sans-serif; }
      body { display: grid; grid-template-columns: 220px 1fr; grid-template-rows: 1fr 160px; }
      #parametres { grid-row: 1 / span 2; overflow: auto; background: var(--color-background-panel, #161616); color: var(--color-text-primary, #e8e8e8); border-right: 1px solid var(--color-border, #333); padding: 12px; font: 13px var(--font-family-ui, sans-serif); }
      #parametres h2 { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
      #parametres li { list-style: none; margin: 0 0 6px; }
      canvas { width: 100%; height: 100%; display: block; }
      form { display: grid; grid-template-rows: 1fr auto; border-top: 1px solid #333; }
      textarea { background: #111; color: #d0d0d0; border: 0; resize: none; padding: 8px; }
      input { background: #111; color: #fff; border: 0; border-top: 1px solid #333; padding: 8px; }
    </style>
  </head>
  <body>
    <aside id="parametres"><h2>Paramètres</h2><ul></ul></aside>
    <canvas id="vue"></canvas>
    <form id="terminal">
      <textarea id="journal" readonly></textarea>
      <input id="ligne" autocomplete="off" placeholder="commande" />
    </form>
    <script type="module" src="/src/page.ts"></script>
  </body>
</html>
